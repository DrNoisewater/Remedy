# Release: started by hand (Actions > Release > Run workflow) with a version like 1.3.0.
# Checks the version, runs the tests, builds Remedy.exe, zips it, tags the commit and publishes a GitHub Release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, three numbers like 1.3.0 (must match APP_VERSION in remedy/core/utils.py)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  APP_NAME: Remedy

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the version looks like 1.3.0
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad version::'$VERSION' is not a valid version. Type three numbers separated by dots, like 1.3.0 (no 'v', no words, no spaces)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Check this is the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error title=Wrong branch::Releases must be started from '$DEFAULT_BRANCH', but this run was started from '$GITHUB_REF_NAME'. Pick '$DEFAULT_BRANCH' in the 'Use workflow from' box."
            exit 1
          fi

      - name: Check the version matches the project
        run: |
          PROJECT_VERSION=$(sed -nE 's/^APP_VERSION *= *"([^"]+)".*/\1/p' remedy/core/utils.py)
          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error title=Version not bumped::You asked to release $VERSION, but the project says $PROJECT_VERSION (APP_VERSION in remedy/core/utils.py). Change it to $VERSION in a commit on the default branch first, then run Release again."
            exit 1
          fi

      - name: Check tag v${{ inputs.version }} does not exist yet
        run: |
          if [[ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]]; then
            echo "::error title=Already released::Tag v$VERSION already exists, so $VERSION has already been released. Bump to a new version first."
            exit 1
          fi

      - name: Install Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies (pinned)
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run tests (stops here if any fail)
        run: python -m pytest -v

      - name: Build Remedy.exe (release build)
        run: |
          python make_version_info.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name Remedy \
            --icon remedy.ico --version-file version_info.txt --collect-submodules remedy main.py

      - name: Check the built exe carries the right version
        shell: pwsh
        run: |
          $v = (Get-Item dist/Remedy.exe).VersionInfo.ProductVersion
          if ($v -ne $env:VERSION) { Write-Error "Remedy.exe says version '$v', expected '$env:VERSION'"; exit 1 }
          Write-Host "Remedy.exe version $v OK"

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "$env:APP_NAME-v$env:VERSION-win-x64.zip"
          Compress-Archive -Path dist/Remedy.exe -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tag the exact commit that was built
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$GITHUB_SHA" -m "$APP_NAME v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          - **Download:** \`$ZIP_NAME\` (under Assets below).
          - **Run it:** unzip it anywhere and double-click \`Remedy.exe\`. No install or Python needed; it will ask for administrator rights.
          - **"Unknown publisher" warning:** Windows SmartScreen may say "Windows protected your PC". Click **More info**, then **Run anyway**.

          NOTES
          gh release create "v$VERSION" "$ZIP_NAME" \
            --verify-tag \
            --title "$APP_NAME v$VERSION" \
            --notes-file notes.md \
            --generate-notes
          echo "Release page: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
